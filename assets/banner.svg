<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glow-india" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow-china" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="line-india-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="line-china-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Dynamic Pulse Animations & Wave Shifts -->
    <style>
      @keyframes pulseIndia {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.85; }
        50% { transform: translateY(-6px) scale(1.02); opacity: 1; }
      }
      @keyframes pulseChina {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.85; }
        50% { transform: translateY(6px) scale(0.99); opacity: 1; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0) translateX(0); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0) translateX(0); opacity: 0.2; }
      }
      @keyframes gridPulse {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }
      @keyframes beaconRing {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      .anim-wave-india {
        stroke-dasharray: 600;
        animation: waveFlow 7s ease-in-out infinite alternate;
      }
      .anim-wave-china {
        stroke-dasharray: 600;
        animation: waveFlow 8s ease-in-out infinite alternate-reverse;
      }
      .card-india {
        animation: pulseIndia 4.5s ease-in-out infinite;
      }
      .card-china {
        animation: pulseChina 5s ease-in-out infinite;
      }
      .p1 { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .beacon {
        animation: beaconRing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- 1. Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>

  <!-- 2. Ambient Color Blobs in Background -->
  <g opacity="0.3" filter="url(#blur-filter)">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" />
    <circle cx="1020" cy="180" r="160" fill="#10b981" />
    <circle cx="820" cy="280" r="130" fill="#ef4444" />
  </g>

  <!-- 3. Modern Tech Grid Pattern -->
  <g opacity="0.15" style="animation: gridPulse 4s ease-in-out infinite;">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#334155" stroke-width="1" stroke-dasharray="4,6"/>
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#334155" stroke-width="1" stroke-dasharray="4,6"/>
  </g>

  <!-- 4. Dynamic Abstract Trends Chart in Right Background -->
  <g opacity="0.45">
    <!-- China Curve (Downwards trajectory post 2021) -->
    <path class="anim-wave-china" d="M 520,240 C 620,210 700,150 780,140 C 850,130 920,220 1020,260 C 1100,285 1160,290 1200,295" fill="none" stroke="url(#line-china-grad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- India Curve (Strong sustained growth upward) -->
    <path class="anim-wave-india" d="M 520,290 C 640,280 720,230 810,190 C 890,150 990,110 1080,75 C 1130,55 1170,45 1200,40" fill="none" stroke="url(#line-india-grad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="p1" cx="680" cy="110" r="3" fill="#38bdf8"/>
  <circle class="p2" cx="950" cy="80" r="4" fill="#34d399"/>
  <circle class="p3" cx="1120" cy="190" r="3" fill="#f87171"/>

  <!-- 5. Floating Dynamic Metric Pills / Cards (Right Section) -->
  <g transform="translate(870, 75)" class="card-india" filter="url(#card-shadow)">
    <rect width="250" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="27" r="10" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="26" cy="27" r="4" fill="#10b981"/>
    <circle cx="26" cy="27" class="beacon" fill="none" stroke="#10b981" stroke-width="1.5"/>
    
    <text x="44" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">INDIA INDEX (2016-26)</text>
    <text x="26" y="58" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">366.84</text>
    <text x="108" y="56" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">▲ +44.9% Nominal</text>
  </g>

  <g transform="translate(870, 185)" class="card-china" filter="url(#card-shadow)">
    <rect width="250" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="26" cy="27" r="10" fill="#ef4444" fill-opacity="0.2"/>
    <circle cx="26" cy="27" r="4" fill="#ef4444"/>
    <circle cx="26" cy="27" class="beacon" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    
    <text x="44" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">CHINA INDEX (2016-26)</text>
    <text x="26" y="58" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">113.98</text>
    <text x="108" y="56" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">▼ Re-adjustment</text>
  </g>

  <!-- 6. Foreground Brand & Hero Text (Guaranteed in Front & Crystal Clear) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="235" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">MACROECONOMIC RESEARCH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.8">
      Residential Property Price Trends
    </text>

    <!-- Subtitle with Highlight Pill -->
    <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      A 10-Year Comparative Analysis:
      <tspan fill="#f59e0b" font-weight="700"> China (🇨🇳) </tspan>
      <tspan fill="#64748b">vs.</tspan>
      <tspan fill="#10b981" font-weight="700"> India (🇮🇳)</tspan>
    </text>

    <!-- Secondary Meta Description -->
    <text x="0" y="222" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Decoupling Trajectories in Emerging Powerhouses (2016 – 2026)
    </text>

    <!-- Data Badges Row -->
    <g transform="translate(0, 260)">
      <!-- BIS / FRED Tag -->
      <rect width="170" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Source: <tspan fill="#f8fafc" font-weight="700">BIS / FRED Data</tspan></text>

      <!-- Baseline Tag -->
      <rect x="180" width="135" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="194" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Base: <tspan fill="#f8fafc" font-weight="700">2010 = 100</tspan></text>

      <!-- Quarterly Tag -->
      <rect x="325" width="165" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="339" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Granularity: <tspan fill="#f8fafc" font-weight="700">Quarterly Real &amp; Nom</tspan></text>
    </g>
  </g>
</svg>
